# Accepts Kitden version bumps. Once "brew test-bot" passes on a bump pull request, this
# runs the tap's own "brew pr-pull" workflow (publish.yml) so the bottles are published.
# Nobody presses the Merge button on a bump: pr-pull pushes the formula and bottles to main.
#
# Runs that are not a passed test of a bump-kitden-* pull request from this repository are
# skipped silently. After that, any failed check turns this run red on purpose, for example
# when a bump pull request was superseded by a newer commit or a newer version.
#
# Trusted authors of a bump pull request: github-actions[bot], the tap app (autobump.yml)
# and the Kitden release app (Kitden's publish job opens its pull request from Kitden's own
# repository, so this tap never holds the release app's key).
#
# One-time setup by the tap owner (autobump.yml uses the first and the last):
#   - variable TAP_APP_CLIENT_ID: the tap app's client ID (kitden-kettle)
#   - variable TAP_APP_BOT: the tap app's bot login, for example kitden-kettle[bot]
#   - variable RELEASE_APP_BOT: the release app's bot login, for example kitden-beacon[bot]
#   - secret TAP_APP_PRIVATE_KEY: the tap app's private key
name: auto-pull

on:
  # zizmor: ignore[dangerous-triggers] -- never checks out or runs pull request code; it only
  # reads pull request metadata through the API and dispatches the tap's own publish.yml.
  workflow_run:
    workflows: ["brew test-bot"]
    types: [completed]

permissions: {}

concurrency:
  group: auto-pull
  cancel-in-progress: false

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  auto-pull:
    # These skips are silent on purpose. A failed test run is already red on its own, and
    # fork or non-pull_request runs must never get a job that holds actions: write. Once a
    # run passes this condition, every later check fails loudly with ::error::.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'bump-kitden-')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check the pull request
        id: pr
        env:
          RUN_PRS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RELEASE_APP_BOT: ${{ vars.RELEASE_APP_BOT }}
          TAP_APP_BOT: ${{ vars.TAP_APP_BOT }}
        run: |
          # The job condition already matched bump-kitden-*, so a failed check below is
          # an error the owner should see, not a silent skip.
          fail() { echo "::error::$1"; exit 1; }

          number="$(jq -r '.[0].number // empty' <<<"$RUN_PRS")"
          [[ "$number" =~ ^[0-9]+$ ]] || fail "Run for $RUN_HEAD_BRANCH has no pull request."

          pr="$(gh api "repos/$GH_REPO/pulls/$number")"
          state="$(jq -r '.state' <<<"$pr")"
          base_ref="$(jq -r '.base.ref' <<<"$pr")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"$pr")"
          head_ref="$(jq -r '.head.ref' <<<"$pr")"
          head_sha="$(jq -r '.head.sha' <<<"$pr")"
          author="$(jq -r '.user.login' <<<"$pr")"

          [[ "$state" == "open" ]] || fail "Pull request #$number is $state."
          [[ "$base_ref" == "main" ]] || fail "Pull request #$number targets $base_ref, not main."
          [[ "$head_repo" == "$GH_REPO" ]] || fail "Pull request #$number comes from $head_repo, not this repository."
          [[ "$head_ref" =~ ^bump-kitden-([0-9]+\.[0-9]+\.[0-9]+)$ ]] \
            || fail "Branch $head_ref is not bump-kitden-X.Y.Z."
          version="${BASH_REMATCH[1]}"
          [[ "$head_sha" == "$RUN_HEAD_SHA" ]] \
            || fail "Pull request #$number moved on after the tested commit; the new commit must pass tests first."
          trusted=false
          for bot in "github-actions[bot]" "$RELEASE_APP_BOT" "$TAP_APP_BOT"; do
            if [[ -n "$bot" && "$author" == "$bot" ]]; then trusted=true; fi
          done
          [[ "$trusted" == true ]] || fail "Pull request #$number was opened by $author, which is not a trusted bot."
          files="$(gh api --paginate "repos/$GH_REPO/pulls/$number/files" --jq '.[] | "\(.filename) \(.status)"')"
          [[ "$files" == "Formula/kitden.rb modified" ]] \
            || fail "Pull request #$number must modify only Formula/kitden.rb; it changes: ${files//$'\n'/, }"

          {
            echo "number=$number"
            echo "head_sha=$head_sha"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Publish bottles with pr-pull
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          # gh does not reliably print the run it dispatched, so find it by difference:
          # runs of publish.yml started by this workflow's token (github-actions[bot]) that
          # did not exist before the dispatch. This does not depend on the runner clock, and
          # a manual run by the owner has another actor. The concurrency group above keeps
          # this workflow to one dispatch at a time.
          list_runs() {
            gh run list --workflow publish.yml --event workflow_dispatch --user 'github-actions[bot]' \
              --limit 50 --json databaseId --jq '.[].databaseId'
          }
          before="$(list_runs)"
          gh workflow run publish.yml -f "pull_request=$PR_NUMBER" -f "head_sha=$PR_HEAD_SHA"

          run_id=""
          for _ in $(seq 1 30); do
            sleep 10
            run_id="$(comm -13 <(sort <<<"$before") <(list_runs | sort))"
            [[ -n "$run_id" ]] && break
          done
          [[ -n "$run_id" ]] || { echo "::error::The publish.yml run did not start."; exit 1; }
          if [[ "$(wc -l <<<"$run_id")" -ne 1 ]]; then
            echo "::error::Expected one new publish.yml run, found: ${run_id//$'\n'/ }"
            exit 1
          fi
          echo "Watching publish.yml run $run_id"
          gh run watch "$run_id" --exit-status

      - name: Check the published bottle
        env:
          VERSION: ${{ steps.pr.outputs.version }}
        run: |
          formula="$(gh api -H "Accept: application/vnd.github.raw" \
            "repos/$GH_REPO/contents/Formula/kitden.rb?ref=main")"
          url_version="$(sed -nE 's#^[[:space:]]*url ".*/kitden-([0-9]+\.[0-9]+\.[0-9]+)\.tar\.gz".*#\1#p' <<<"$formula" | head -n 1)"
          root_url="$(sed -nE 's#^[[:space:]]*root_url "([^"]+)".*#\1#p' <<<"$formula" | head -n 1)"
          if [[ "$url_version" != "$VERSION" ]]; then
            echo "::error::Formula on main is at version '$url_version', expected $VERSION."
            exit 1
          fi
          if [[ "$root_url" != *"/kitden-$VERSION" ]]; then
            echo "::error::Bottle root_url is '$root_url', expected it to end with kitden-$VERSION."
            exit 1
          fi
          echo "Published kitden $VERSION: $root_url"
